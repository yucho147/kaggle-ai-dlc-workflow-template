# Start from the repository root. Optional sources are documented in docs/05_mcp_setup.md.
[mcp_servers.kaggle]
command = "uv"
args = ["run", "--locked", "--group", "mcp", "python", "tools/kaggle-mcp/server.py"]
cwd = "."
env = { UV_CACHE_DIR = ".cache/uv" }
startup_timeout_sec = 60
tool_timeout_sec = 900
