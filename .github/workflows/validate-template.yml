name: Validate workflow template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group research --group mcp
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python scripts/check_template.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/render_improvement_report.py
